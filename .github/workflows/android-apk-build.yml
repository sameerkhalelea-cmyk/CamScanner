
name: Build CamScanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CamScanner-AndroidProject.zip'
      - '.github/workflows/android-apk-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Extract project
        run: unzip -q CamScanner-AndroidProject.zip

      - name: Build APK
        run: gradle -p CamScanner assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CamScanner-debug-APK
          path: CamScanner/app/build/outputs/apk/debug/app-debug.apk
